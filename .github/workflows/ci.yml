name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node@v5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.8.0

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare infra validation
        run: npm run infra:validate

      - name: Test with coverage
        run: npm run test:coverage

      - name: Audit
        run: npm audit --json

      - name: Audit signatures
        run: npm audit signatures

      - name: OSS scan
        run: npm run scan:oss

      - name: Whitespace check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r HEAD
          else
            if ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
              git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
            fi
            git diff --check "${BEFORE_SHA}" HEAD
          fi
